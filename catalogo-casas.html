<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Catálogo de casas modulares — MedLink</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/broadsheet-7506f139-3270-41ec-9230-ad380aef7611/styles.css">
<script src="_ds/broadsheet-7506f139-3270-41ec-9230-ad380aef7611/_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--color-bg); -webkit-font-smoothing: antialiased; }
  a { color: var(--color-accent); }
  a:hover { color: var(--color-accent-700); }
</style>
</helmet>

<div style="max-width:1200px;margin:0 auto;padding:0 24px 60px">

  <header class="nav" style="padding-left:0;padding-right:0">
    <span class="nav-brand" style="letter-spacing:-0.01em">MedLink</span>
    <div style="display:flex;gap:24px;align-items:center;font-size:14px">
      <a href="index.html" style="text-decoration:none">Catálogo geral</a>
      <a href="tel:965349393" style="font-family:var(--font-heading);font-weight:600;text-decoration:none;color:var(--color-accent-700)" style-hover="color:var(--color-accent)">965 349 393</a>
    </div>
  </header>

  <section style="margin:var(--space-6) 0 var(--space-4)">
    <h6 style="color:var(--color-accent-700);margin-bottom:var(--space-2)">Categoria</h6>
    <h1 style="font-size:clamp(32px,4.6vw,48px);letter-spacing:-0.02em;margin-bottom:0">Casas modulares</h1>
  </section>

  <section style="display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center;margin-bottom:var(--space-4)">
    <input class="input" style="max-width:280px" type="text" placeholder="Pesquisar modelo (ex. M7)" value="{{ query }}" onChange="{{ onQuery }}">
    <select class="input" style="max-width:220px" value="{{ sort }}" onChange="{{ onSort }}">
      <option value="area-asc">Área: menor primeiro</option>
      <option value="area-desc">Área: maior primeiro</option>
      <option value="price-asc">Preço: menor primeiro</option>
      <option value="price-desc">Preço: maior primeiro</option>
    </select>
    <span style="font-size:13px;color:var(--color-neutral-700);margin-left:auto">{{ count }} modelos</span>
  </section>

  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:var(--space-3)">
    <sc-for list="{{ items }}" as="p" hint-placeholder-count="11">
      <a class="card elev-sm" href="{{ p.href }}" style="text-decoration:none;color:inherit;padding:var(--space-2)" style-hover="box-shadow:var(--shadow-md)">
        <img src="{{ p.hero }}" alt="{{ p.code }}" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--radius-md);mix-blend-mode:multiply">
        <span class="tag tag-neutral" style="align-self:flex-start">{{ p.family }}</span>
        <div class="card-title" style="margin-top:0">{{ p.code }}</div>
        <div class="card-meta">{{ p.area }} m²</div>
        <div style="font-family:var(--font-heading);font-weight:600;font-size:15px;color:{{ p.priceColor }}">{{ p.priceLabel }}</div>
      </a>
    </sc-for>
  </div>

  <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
    <p style="margin-top:var(--space-6);color:var(--color-neutral-700)">Nenhum modelo encontrado para "{{ query }}".</p>
  </sc-if>

  <footer style="margin-top:var(--space-8);display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:flex-end">
    <div>
      <h6 style="color:var(--color-accent-700);margin-bottom:var(--space-2)">Pedidos ou assistência</h6>
      <a href="tel:965349393" style="display:block;font-family:var(--font-heading);font-weight:600;font-size:clamp(32px,5vw,52px);line-height:1;letter-spacing:-0.03em;text-decoration:none;color:var(--color-text)" style-hover="color:var(--color-accent)">965 349 393</a>
    </div>
  </footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const MODELS = [
  { code: "S3", area: 12.3, family: "Modular", price: 18950, hero: "houses/h3-2.jpg" },
  { code: "M3", area: 18.4, family: "LEGO", price: 20950, hero: "houses/h2-4.jpg" },
  { code: "Y6", area: 24.7, family: "Modular", price: 30950, hero: "houses/h3-5.jpg" },
  { code: "M5", area: 27, family: "LEGO", price: 30950, hero: "houses/h2-2.jpg" },
  { code: "20FT1", area: 32, family: "Contentor", price: 14950, hero: "houses/h1-2.jpg" },
  { code: "M7", area: 36, family: "LEGO", price: 40950, hero: "houses/h2-0.jpg" },
  { code: "20FT", area: 38, family: "Contentor", price: 16950, hero: "houses/h1-3.jpg" },
  { code: "P7", area: 38, family: "Modular", price: null, hero: "houses/h3-0.jpg" },
  { code: "V6", area: 38.4, family: "Modular", price: null, hero: "houses/h3-4.jpg" },
  { code: "40FT", area: 73, family: "Contentor", price: 20950, hero: "houses/h1-0.jpg" },
  { code: "20FT 2 pisos", area: 96, family: "Contentor", price: null, hero: "houses/h1-1.jpg" }
];
const HREF = {
  S3: "s3", M3: "m3", Y6: "y6", M5: "m5", "20FT1": "c20ft1", M7: "m7",
  "20FT": "c20ft", P7: "p7", V6: "v6", "40FT": "c40ft", "20FT 2 pisos": "c20ft2"
};

class Component extends DCLogic {
  state = { query: "", sort: "area-asc" };

  renderVals() {
    const q = this.state.query.trim().toUpperCase();
    let list = MODELS.filter(m => !q || m.code.toUpperCase().includes(q));
    const s = this.state.sort;
    const withPrice = m => m.price ?? Infinity;
    if (s === "area-asc") list = list.slice().sort((a, b) => a.area - b.area);
    else if (s === "area-desc") list = list.slice().sort((a, b) => b.area - a.area);
    else if (s === "price-asc") list = list.slice().sort((a, b) => withPrice(a) - withPrice(b));
    else if (s === "price-desc") list = list.slice().sort((a, b) => (b.price ?? -1) - (a.price ?? -1));
    return {
      query: this.state.query,
      sort: this.state.sort,
      onQuery: e => this.setState({ query: e.target.value }),
      onSort: e => this.setState({ sort: e.target.value }),
      count: list.length,
      empty: list.length === 0,
      items: list.map(m => ({
        code: m.code,
        area: m.area.toString().replace(".", ","),
        family: m.family,
        priceLabel: m.price ? m.price.toLocaleString("pt-PT") + " €" : "Sob consulta",
        priceColor: m.price ? "var(--color-text)" : "var(--color-accent-700)",
        hero: m.hero,
        href: "fichas-casas.html#" + HREF[m.code]
      }))
    };
  }
}
</script>
</body>
</html>
