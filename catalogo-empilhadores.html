<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Catálogo de empilhadores — MedLink</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="styles.css">
<script src="_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--color-bg); -webkit-font-smoothing: antialiased; }
  a { color: var(--color-accent); }
  a:hover { color: var(--color-accent-700); }
</style>
</helmet>

<div style="max-width:1200px;margin:0 auto;padding:0 24px 60px">

  <header class="nav" style="padding-left:0;padding-right:0">
    <span class="nav-brand" style="letter-spacing:-0.01em">MedLink</span>
    <div style="display:flex;gap:24px;align-items:center;font-size:14px">
      <a href="index.html" style="text-decoration:none">Catálogo geral</a>
      <a href="tel:965349393" style="font-family:var(--font-heading);font-weight:600;text-decoration:none;color:var(--color-accent-700)" style-hover="color:var(--color-accent)">965 349 393</a>
    </div>
  </header>

  <section style="margin:var(--space-6) 0 var(--space-4)">
    <h6 style="color:var(--color-accent-700);margin-bottom:var(--space-2)">Categoria</h6>
    <h1 style="font-size:clamp(32px,4.6vw,48px);letter-spacing:-0.02em;margin-bottom:0">Empilhadores elétricos</h1>
  </section>

  <section style="display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center;margin-bottom:var(--space-4)">
    <input class="input" style="max-width:280px" type="text" placeholder="Pesquisar modelo (ex. CPD30)" value="{{ query }}" onChange="{{ onQuery }}">
    <select class="input" style="max-width:220px" value="{{ sort }}" onChange="{{ onSort }}">
      <option value="ton-asc">Capacidade: menor primeiro</option>
      <option value="ton-desc">Capacidade: maior primeiro</option>
      <option value="code">Código do modelo</option>
    </select>
    <span style="font-size:13px;color:var(--color-neutral-700);margin-left:auto">{{ count }} modelos</span>
  </section>

  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:var(--space-3)">
    <sc-for list="{{ items }}" as="p" hint-placeholder-count="10">
      <a class="card elev-sm" href="{{ p.href }}" style="text-decoration:none;color:inherit;padding:var(--space-2)" style-hover="box-shadow:var(--shadow-md)">
        <img src="{{ p.hero }}" alt="{{ p.code }}" style="width:100%;aspect-ratio:4/3;object-fit:contain;background:var(--color-neutral-100);border-radius:var(--radius-md);mix-blend-mode:multiply">
        <div class="card-title" style="margin-top:var(--space-1)">{{ p.code }}</div>
        <div class="card-meta">{{ p.load }} · elétrico</div>
      </a>
    </sc-for>
  </div>

  <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
    <p style="margin-top:var(--space-6);color:var(--color-neutral-700)">Nenhum modelo encontrado para "{{ query }}".</p>
  </sc-if>

  <footer style="margin-top:var(--space-8);display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:flex-end">
    <div>
      <h6 style="color:var(--color-accent-700);margin-bottom:var(--space-2)">Pedidos ou assistência</h6>
      <a href="tel:965349393" style="display:block;font-family:var(--font-heading);font-weight:600;font-size:clamp(32px,5vw,52px);line-height:1;letter-spacing:-0.03em;text-decoration:none;color:var(--color-text)" style-hover="color:var(--color-accent)">965 349 393</a>
    </div>
  </footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const MODELS = [
  { code: "CPD10", ton: 1, load: "1 t", hero: "p03-8.jpg" },
  { code: "CPD15", ton: 1.5, load: "1,5 t", hero: "p04-1.jpg" },
  { code: "CPD20", ton: 2, load: "2 t", hero: "p05-0.jpg" },
  { code: "CPD25", ton: 2.5, load: "2,5 t", hero: "p06-0.jpg" },
  { code: "CPD30", ton: 3, load: "3 t", hero: "p07-0.jpg" },
  { code: "CPD35", ton: 3.5, load: "3,5 t", hero: "p08-8.jpg" },
  { code: "CPD40", ton: 4, load: "4 t", hero: "p09-0.jpg" },
  { code: "CPD50", ton: 5, load: "5 t", hero: "p10-0.jpg" },
  { code: "CPD70", ton: 7, load: "7 t", hero: "p11-0.jpg" },
  { code: "CPD100", ton: 10, load: "10 t", hero: "p12-7.jpg" }
];

class Component extends DCLogic {
  state = { query: "", sort: "ton-asc" };

  renderVals() {
    const q = this.state.query.trim().toUpperCase();
    let list = MODELS.filter(m => !q || m.code.includes(q));
    if (this.state.sort === "ton-asc") list = list.slice().sort((a, b) => a.ton - b.ton);
    else if (this.state.sort === "ton-desc") list = list.slice().sort((a, b) => b.ton - a.ton);
    else list = list.slice().sort((a, b) => a.code.localeCompare(b.code));
    return {
      query: this.state.query,
      sort: this.state.sort,
      onQuery: e => this.setState({ query: e.target.value }),
      onSort: e => this.setState({ sort: e.target.value }),
      count: list.length,
      empty: list.length === 0,
      items: list.map(m => ({ code: m.code, load: m.load, hero: m.hero, href: "fichas-empilhadores.html#" + m.code }))
    };
  }
}
</script>
</body>
</html>
